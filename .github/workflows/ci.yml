# CI/CD pipeline for the Library Management System.
# Runs automatically on every push and pull request to the main branch.

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with pytest
        run: pytest

  docker:
    name: Build and test Docker image
    needs: test  # only runs if all tests passed
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the Docker image
        run: docker build -t library-app:ci .

      - name: Start a container from the image
        run: docker run -d --name library-ci -p 5000:5000 library-app:ci

      - name: Wait for the health check to pass
        run: |
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo ""
              echo "Application is healthy."
              exit 0
            fi
            echo "Waiting for the application to start ($attempt/15)..."
            sleep 2
          done
          echo "Application did not become healthy in time."
          exit 1

      - name: Check that the home page loads
        run: curl -fsS http://localhost:5000/ | grep "Library Management System"

      - name: Check that the API returns the sample books
        run: curl -fsS http://localhost:5000/api/books | grep "Clean Code"

      - name: Show container logs
        if: always()
        run: docker logs library-ci || true

      - name: Remove the test container
        if: always()
        run: docker rm -f library-ci || true
